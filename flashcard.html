<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>HSK Flashcards · Spaced Repetition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif; }
    
    body.light {
      background: linear-gradient(145deg, #eef2ff 0%, #c7d2fe 100%);
      --bg-card: rgba(255,255,255,0.85);
      --bg-header: rgba(255,255,255,0.4);
      --text-primary: #1e1b4b;
      --text-secondary: #4f46e5;
      --border-light: #c7d2fe;
      --accent: #4f46e5;
      --accent-hover: #6366f1;
      --shadow: 0 25px 50px rgba(79,70,229,0.2);
      --card-glow: rgba(79,70,229,0.1);
    }
    body.dark {
      background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 100%);
      --bg-card: rgba(30,41,59,0.9);
      --bg-header: rgba(15,23,42,0.6);
      --text-primary: #e2e8f0;
      --text-secondary: #a5b4fc;
      --border-light: #334155;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --shadow: 0 25px 50px rgba(0,0,0,0.5);
      --card-glow: rgba(129,140,248,0.15);
    }
    
    body { padding: 1.5rem; display: flex; flex-direction: column; align-items: center; background: var(--bg-header); min-height: 100vh; }
    .container {
      max-width: 820px; width: 100%; background: var(--bg-header); backdrop-filter: blur(20px);
      border-radius: 2.5rem; padding: 2rem; box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    h1 { text-align: center; font-size: 2.4rem; background: linear-gradient(135deg, var(--text-secondary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0.2rem; letter-spacing: -0.5px; }
    .sub { text-align: center; color: var(--text-secondary); font-size: 1rem; margin-bottom: 1.5rem; opacity: 0.8; font-weight: 500; }
    
    .level-selector { display: flex; justify-content: center; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .level-btn {
      background: var(--bg-card); border: 2px solid var(--border-light); color: var(--text-primary);
      padding: 0.5rem 1.2rem; border-radius: 40px; cursor: pointer; font-weight: 700; font-size: 0.9rem;
      transition: all 0.2s; backdrop-filter: blur(4px);
    }
    .level-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 15px rgba(79,70,229,0.3); }
    .level-btn:hover:not(.active) { border-color: var(--accent); transform: translateY(-2px); }
    
    .stats-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-card); border-radius: 1.5rem; padding: 0.8rem 1.2rem;
      border: 1px solid var(--border-light); margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem;
      backdrop-filter: blur(4px);
    }
    .stat-item { font-size: 0.9rem; color: var(--text-primary); font-weight: 500; }
    .stat-item strong { color: var(--accent); font-size: 1.1rem; }
    .stat-item i { margin-right: 6px; color: var(--accent); }
    
    /* ----- FLASHCARD (BIG, BEAUTIFUL) ----- */
    .flashcard-container {
      perspective: 1200px; margin: 0.5rem 0 1.2rem; cursor: pointer;
    }
    .flashcard {
      background: var(--bg-card); backdrop-filter: blur(8px);
      border-radius: 2rem; padding: 3rem 2rem;
      min-height: 380px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 1px solid var(--border-light); 
      box-shadow: 0 20px 40px var(--card-glow), 0 8px 20px rgba(0,0,0,0.06);
      text-align: center;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      transform: rotateX(0deg);
    }
    .flashcard.flipped { transform: rotateX(180deg); }
    
    .card-front, .card-back {
      backface-visibility: hidden;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }
    .card-back { transform: rotateX(180deg); position: absolute; top: 0; left: 0; height: 100%; padding: 3rem 2rem; }
    
    /* FRONT SIDE */
    .card-front .chinese { 
      font-size: 5.5rem; font-weight: 700; color: var(--text-primary); 
      line-height: 1.2; letter-spacing: 4px;
      text-shadow: 0 2px 10px var(--card-glow);
    }
    .card-front .hint { 
      font-size: 0.9rem; color: var(--text-secondary); 
      opacity: 0.5; margin-top: 0.5rem; 
      display: flex; align-items: center; gap: 8px;
    }
    .card-front .progress-hint {
      margin-top: 1.2rem; font-size: 0.85rem; color: var(--text-secondary);
      background: var(--bg-header); padding: 0.3rem 1.2rem; border-radius: 40px;
      border: 1px solid var(--border-light);
      font-weight: 600;
    }
    
    /* BACK SIDE */
    .card-back .pinyin { font-size: 2.2rem; font-weight: 600; color: var(--text-secondary); letter-spacing: 1px; }
    .card-back .meaning { font-size: 2rem; font-weight: 700; color: var(--text-primary); margin-top: 0.2rem; }
    .card-back .example { 
      font-size: 1.1rem; color: var(--text-secondary); margin-top: 1rem; 
      font-style: italic; background: var(--bg-header); padding: 0.5rem 1.2rem; 
      border-radius: 1rem; border-left: 4px solid var(--accent);
      max-width: 90%;
    }
    
    /* RATING BAR */
    .rating-bar {
      display: flex; gap: 0.8rem; justify-content: center; margin: 1.2rem 0 0.5rem;
    }
    .rating-btn {
      padding: 0.7rem 1.6rem; border-radius: 50px; border: 2px solid var(--border-light);
      background: var(--bg-card); color: var(--text-primary); cursor: pointer;
      font-weight: 700; font-size: 1rem; transition: all 0.15s;
      flex: 1; max-width: 160px; display: flex; align-items: center; justify-content: center; gap: 8px;
      backdrop-filter: blur(4px);
    }
    .rating-btn:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .rating-btn:active { transform: scale(0.95); }
    .rating-btn.again { border-color: #e53e3e; color: #e53e3e; background: rgba(229,62,62,0.05); }
    .rating-btn.again:hover { background: #e53e3e; color: white; }
    .rating-btn.hard { border-color: #ed8936; color: #ed8936; background: rgba(237,137,54,0.05); }
    .rating-btn.hard:hover { background: #ed8936; color: white; }
    .rating-btn.good { border-color: #38a169; color: #38a169; background: rgba(56,161,105,0.05); }
    .rating-btn.good:hover { background: #38a169; color: white; }
    .rating-btn.easy { border-color: #3182ce; color: #3182ce; background: rgba(49,130,206,0.05); }
    .rating-btn.easy:hover { background: #3182ce; color: white; }
    
    .rating-bar.hidden { display: none; }
    
    .controls { display: flex; justify-content: center; gap: 1rem; margin-top: 0.8rem; flex-wrap: wrap; }
    .ctrl-btn {
      background: var(--bg-card); border: 1px solid var(--border-light); color: var(--text-primary);
      padding: 0.6rem 1.4rem; border-radius: 40px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
      transition: 0.15s; display: flex; align-items: center; gap: 8px;
      backdrop-filter: blur(4px);
    }
    .ctrl-btn:hover { background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-2px); }
    .ctrl-btn.danger:hover { background: #e53e3e; border-color: #e53e3e; }
    
    .shortcuts { text-align: center; font-size: 0.75rem; color: var(--text-secondary); opacity: 0.4; margin-top: 1rem; letter-spacing: 0.3px; }
    .shortcuts span { display: inline-block; margin: 0 0.6rem; }
    
    .back-btn {
      display: inline-block; background: var(--accent); color: white;
      padding: 0.6rem 1.5rem; border-radius: 40px; text-decoration: none;
      margin-top: 1.2rem; font-size: 1rem; font-weight: 600; transition: 0.15s;
      border: 1px solid transparent;
    }
    .back-btn:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79,70,229,0.3); }
    
    .empty-state { text-align: center; padding: 2rem; color: var(--text-secondary); }
    .empty-state i { font-size: 3.5rem; display: block; margin-bottom: 1rem; opacity: 0.3; }
    
    @media (max-width: 600px) {
      .container { padding: 1rem; }
      .card-front .chinese { font-size: 4rem; }
      .card-back .pinyin { font-size: 1.6rem; }
      .card-back .meaning { font-size: 1.4rem; }
      .flashcard { min-height: 280px; padding: 2rem 1rem; }
      .rating-btn { font-size: 0.8rem; padding: 0.5rem 0.8rem; }
      .stats-bar { font-size: 0.75rem; }
      .level-btn { font-size: 0.75rem; padding: 0.3rem 0.8rem; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body class="light">

<div class="container">
  <h1>🧠 HSK Flashcards</h1>
  <div class="sub">Spaced Repetition · Smart Review · Fully Shuffled</div>

  <!-- Level Selector -->
  <div class="level-selector" id="levelSelector">
    <button class="level-btn" data-level="1">HSK 1</button>
    <button class="level-btn" data-level="2">HSK 2</button>
    <button class="level-btn active" data-level="3">HSK 3</button>
    <button class="level-btn" data-level="4">HSK 4</button>
    <button class="level-btn" data-level="5">HSK 5</button>
    <button class="level-btn" data-level="6">HSK 6</button>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <span class="stat-item"><i class="fas fa-clock"></i> Due: <strong id="dueCount">0</strong></span>
    <span class="stat-item"><i class="fas fa-check-circle"></i> Learned: <strong id="learnedCount">0</strong></span>
    <span class="stat-item"><i class="fas fa-database"></i> Total: <strong id="totalCount">0</strong></span>
    <span class="stat-item"><i class="fas fa-percentage"></i> Mastery: <strong id="masteryPercent">0%</strong></span>
  </div>

  <!-- Flashcard -->
  <div class="flashcard-container" id="cardContainer">
    <div class="flashcard" id="flashcard">
      <div class="card-front" id="cardFront">
        <div class="chinese" id="chineseChar">—</div>
        <div class="hint">👆 Tap to flip</div>
        <div class="progress-hint" id="cardCounter">Card 0 / 0</div>
      </div>
      <div class="card-back" id="cardBack">
        <div class="pinyin" id="pinyinDisplay"></div>
        <div class="meaning" id="meaningDisplay"></div>
        <div class="example" id="exampleDisplay"></div>
      </div>
    </div>
  </div>

  <!-- Rating buttons -->
  <div class="rating-bar hidden" id="ratingBar">
    <button class="rating-btn again" data-rating="1">🔄 Again</button>
    <button class="rating-btn hard" data-rating="2">😅 Hard</button>
    <button class="rating-btn good" data-rating="3">😊 Good</button>
    <button class="rating-btn easy" data-rating="4">🚀 Easy</button>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="shuffleBtn"><i class="fas fa-random"></i> Reshuffle</button>
    <button class="ctrl-btn" id="resetBtn"><i class="fas fa-undo"></i> Reset Level</button>
    <button class="ctrl-btn danger" id="resetAllBtn"><i class="fas fa-trash-alt"></i> Reset All</button>
  </div>

  <div class="shortcuts">
    <span>⌨️ Space = flip</span> <span>1 = Again</span> <span>2 = Hard</span> <span>3 = Good</span> <span>4 = Easy</span>
  </div>

  <a href="hsk3_hub.html" class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
</div>

<!-- ========== LOAD ALL HSK WORD LISTS ========== -->
<script src="words_hsk1.js"></script>
<script src="words_hsk2.js"></script>
<script src="words_hsk3.js"></script>
<script src="words_hsk4.js"></script>
<script src="words_hsk5.js"></script>
<script src="words_hsk6.js"></script>

<script>
// ============================================================
//  HSK FLASHCARD SYSTEM – SRS + FULL SHUFFLE
// ============================================================

// ----- HELPERS -----
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getWordList(level) {
  const map = {
    1: window.HSK1_WORDS,
    2: window.HSK2_WORDS,
    3: window.HSK3_WORDS,
    4: window.HSK4_WORDS,
    5: window.HSK5_WORDS,
    6: window.HSK6_WORDS,
  };
  return map[level] || [];
}

function getSRSData(level) {
  const key = `hsk_flashcards_${level}`;
  try { const raw = localStorage.getItem(key); if (raw) return JSON.parse(raw); } catch(e) {}
  return {};
}
function saveSRSData(level, data) {
  localStorage.setItem(`hsk_flashcards_${level}`, JSON.stringify(data));
}

function getDefaultCard(word) {
  return { word: word.word, interval: 1, repetitions: 0, ease: 2.5, nextReview: Date.now() };
}

function initializeCards(level) {
  const words = getWordList(level);
  if (!words || words.length === 0) return {};
  const srs = getSRSData(level);
  let changed = false;
  words.forEach(w => {
    if (!srs[w.word]) { srs[w.word] = getDefaultCard(w); changed = true; }
  });
  if (changed) saveSRSData(level, srs);
  return srs;
}

function updateCard(card, rating) {
  if (rating === 1) { card.repetitions = 0; card.interval = 1; }
  else if (rating === 2) {
    if (card.repetitions === 0) card.interval = 1;
    else if (card.repetitions === 1) card.interval = 2;
    else card.interval = Math.round(card.interval * 1.2);
    card.repetitions += 1; card.ease = Math.max(1.3, card.ease - 0.15);
  } else if (rating === 3) {
    if (card.repetitions === 0) card.interval = 1;
    else if (card.repetitions === 1) card.interval = 3;
    else card.interval = Math.round(card.interval * 2.5);
    card.repetitions += 1;
  } else if (rating === 4) {
    if (card.repetitions === 0) card.interval = 2;
    else if (card.repetitions === 1) card.interval = 4;
    else card.interval = Math.round(card.interval * 3.0);
    card.repetitions += 1; card.ease = Math.min(4.0, card.ease + 0.15);
  }
  if (card.interval > 365) card.interval = 365;
  card.nextReview = Date.now() + (card.interval * 24 * 60 * 60 * 1000);
  return card;
}

// ----- STATE -----
let currentLevel = 3;
let dueQueue = [];
let currentIndex = 0;
let isFlipped = false;
let isReviewing = false;

const chineseChar = document.getElementById('chineseChar');
const pinyinDisplay = document.getElementById('pinyinDisplay');
const meaningDisplay = document.getElementById('meaningDisplay');
const exampleDisplay = document.getElementById('exampleDisplay');
const flashcard = document.getElementById('flashcard');
const ratingBar = document.getElementById('ratingBar');
const cardContainer = document.getElementById('cardContainer');
const cardCounter = document.getElementById('cardCounter');
const dueCount = document.getElementById('dueCount');
const learnedCount = document.getElementById('learnedCount');
const totalCount = document.getElementById('totalCount');
const masteryPercent = document.getElementById('masteryPercent');
const levelBtns = document.querySelectorAll('.level-btn');
const resetBtn = document.getElementById('resetBtn');
const resetAllBtn = document.getElementById('resetAllBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const backBtn = document.getElementById('backBtn');

// ----- RENDER -----
function renderStats() {
  const words = getWordList(currentLevel);
  const total = words.length;
  const srs = getSRSData(currentLevel);
  const now = Date.now();
  let due = 0, learned = 0;
  Object.values(srs).forEach(c => {
    if (c.repetitions > 0) learned++;
    if (c.nextReview <= now) due++;
  });
  words.forEach(w => { if (!srs[w.word]) due++; });
  const mastery = total > 0 ? Math.round((learned / total) * 100) : 0;
  dueCount.textContent = due;
  learnedCount.textContent = learned;
  totalCount.textContent = total;
  masteryPercent.textContent = mastery + '%';
}

function buildQueue() {
  const words = getWordList(currentLevel);
  if (!words || words.length === 0) { dueQueue = []; return; }
  const srs = getSRSData(currentLevel);
  const now = Date.now();
  const due = [];
  const newCards = [];
  words.forEach(w => {
    const card = srs[w.word];
    if (!card) newCards.push(w);
    else if (card.nextReview <= now) due.push(w);
  });
  due.sort((a, b) => {
    const ca = srs[a.word] || { nextReview: 0 };
    const cb = srs[b.word] || { nextReview: 0 };
    return ca.nextReview - cb.nextReview;
  });
  // Combine due + new, then SHUFFLE the whole queue for variety
  let combined = [...due];
  if (newCards.length > 0) {
    const shuffledNew = shuffleArray([...newCards]);
    // Interleave: add some new cards to the mix, but keep due cards first (limited)
    // To make it truly shuffled, we mix everything after taking a slice.
    const maxPerSession = 50;
    const dueSlice = due.slice(0, Math.min(maxPerSession, due.length));
    const remainingSlots = maxPerSession - dueSlice.length;
    const newSlice = shuffledNew.slice(0, Math.max(0, remainingSlots));
    combined = [...dueSlice, ...newSlice];
  } else {
    combined = due.slice(0, 50);
  }
  // FINAL SHUFFLE – this makes every session feel random
  dueQueue = shuffleArray(combined);
  currentIndex = 0;
}

function getCurrentWord() {
  if (dueQueue.length === 0 || currentIndex >= dueQueue.length) return null;
  return dueQueue[currentIndex];
}

function renderCard() {
  const word = getCurrentWord();
  if (!word) {
    chineseChar.textContent = '🎉 All done!';
    pinyinDisplay.textContent = '';
    meaningDisplay.textContent = 'Come back later for more reviews.';
    exampleDisplay.textContent = '';
    cardCounter.textContent = `🎯 0 / 0`;
    flashcard.classList.remove('flipped');
    ratingBar.classList.add('hidden');
    isFlipped = false;
    isReviewing = false;
    return;
  }
  isReviewing = true;
  chineseChar.textContent = word.word;
  pinyinDisplay.textContent = word.pinyin || '';
  meaningDisplay.textContent = word.meaning || '';
  exampleDisplay.textContent = word.example ? `📌 ${word.example}` : '';
  cardCounter.textContent = `📄 ${currentIndex + 1} / ${dueQueue.length}`;
  
  flashcard.classList.remove('flipped');
  ratingBar.classList.add('hidden');
  isFlipped = false;
  renderStats();
}

function flipCard() {
  if (!isReviewing) return;
  flashcard.classList.toggle('flipped');
  if (flashcard.classList.contains('flipped')) {
    ratingBar.classList.remove('hidden');
    isFlipped = true;
  } else {
    ratingBar.classList.add('hidden');
    isFlipped = false;
  }
}

function rateCard(rating) {
  if (!isReviewing || !isFlipped) return;
  const word = getCurrentWord();
  if (!word) return;
  const srs = getSRSData(currentLevel);
  let card = srs[word.word];
  if (!card) card = getDefaultCard(word);
  card = updateCard(card, rating);
  srs[word.word] = card;
  saveSRSData(currentLevel, srs);
  ratingBar.classList.add('hidden');
  flashcard.classList.remove('flipped');
  isFlipped = false;
  currentIndex++;
  renderCard();
}

function reshuffle() {
  if (dueQueue.length === 0) return;
  dueQueue = shuffleArray(dueQueue);
  currentIndex = 0;
  renderCard();
}

// ----- LOAD LEVEL -----
function loadLevel(level) {
  currentLevel = level;
  const words = getWordList(level);
  if (!words || words.length === 0) {
    chineseChar.textContent = '⚠️ No word list';
    pinyinDisplay.textContent = '';
    meaningDisplay.textContent = `words_hsk${level}.js not loaded.`;
    exampleDisplay.textContent = 'Place the file in the same folder.';
    cardCounter.textContent = `📄 0 / 0`;
    ratingBar.classList.add('hidden');
    dueQueue = []; isReviewing = false;
    renderStats();
    backBtn.href = `hsk${level}_hub.html`;
    levelBtns.forEach(b => b.classList.toggle('active', parseInt(b.dataset.level) === level));
    return;
  }
  initializeCards(level);
  buildQueue();
  renderCard();
  renderStats();
  backBtn.href = `hsk${level}_hub.html`;
  levelBtns.forEach(b => b.classList.toggle('active', parseInt(b.dataset.level) === level));
}

// ----- RESET -----
function resetLevel(level) {
  if (!confirm(`Reset ALL flashcard progress for HSK ${level}?`)) return;
  localStorage.removeItem(`hsk_flashcards_${level}`);
  loadLevel(level);
}
function resetAllLevels() {
  if (!confirm('Reset ALL flashcard progress for ALL HSK levels?')) return;
  for (let i = 1; i <= 6; i++) localStorage.removeItem(`hsk_flashcards_${i}`);
  loadLevel(currentLevel);
}

// ----- EVENTS -----
levelBtns.forEach(btn => btn.addEventListener('click', () => loadLevel(parseInt(btn.dataset.level))));
cardContainer.addEventListener('click', (e) => { if (!e.target.closest('.rating-btn')) flipCard(); });
document.querySelectorAll('.rating-btn').forEach(btn => btn.addEventListener('click', () => rateCard(parseInt(btn.dataset.rating))));
shuffleBtn.addEventListener('click', reshuffle);
resetBtn.addEventListener('click', () => resetLevel(currentLevel));
resetAllBtn.addEventListener('click', resetAllLevels);

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); flipCard(); }
  if (e.key >= '1' && e.key <= '4') {
    const btn = document.querySelector(`.rating-btn[data-rating="${e.key}"]`);
    if (btn && !btn.closest('.hidden')) btn.click();
  }
});

// ----- THEME -----
function syncTheme() {
  const saved = localStorage.getItem('hsk_flashcards_theme') || 'light';
  document.body.classList.remove('light', 'dark'); document.body.classList.add(saved);
}
function toggleTheme() {
  const isDark = document.body.classList.contains('dark');
  const newTheme = isDark ? 'light' : 'dark';
  document.body.classList.remove('light', 'dark'); document.body.classList.add(newTheme);
  localStorage.setItem('hsk_flashcards_theme', newTheme);
}
const themeBtn = document.createElement('button');
